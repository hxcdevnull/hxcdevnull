<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1020" height="420" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <path d="M0 40 H1020 M0 80 H1020 M0 120 H1020 M0 160 H1020 M0 200 H1020 M0 240 H1020 M0 280 H1020 M0 320 H1020 M0 360 H1020 M0 400 H1020" />
    <path d="M40 0 V420 M80 0 V420 M120 0 V420 M160 0 V420 M200 0 V420 M240 0 V420 M280 0 V420 M320 0 V420 M360 0 V420 M400 0 V420 M440 0 V420 M480 0 V420 M520 0 V420 M560 0 V420 M600 0 V420 M640 0 V420 M680 0 V420 M720 0 V420 M760 0 V420 M800 0 V420 M840 0 V420 M880 0 V420 M920 0 V420 M960 0 V420 M1000 0 V420" />
  </g>

  <!-- ==================== LEFT SUBGRAPH: CI/CD PIPELINE ==================== -->
  <rect x="25" y="25" width="290" height="370" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="55" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">🚀 CI / CD AUTOMATION PIPELINE</text>
  
  <!-- Step 1: Git Commit -->
  <g filter="url(#cardShadow)">
    <rect x="45" y="75" width="250" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="75" cy="110" r="16" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="75" y="116" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">⌥</text>
    <text x="105" y="103" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Git Commit / Tag</text>
    <text x="105" y="123" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Feature Branches &amp; Releases</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M170 145 V172" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="170,177 165,168 175,168" fill="#38BDF8"/>

  <!-- Step 2: GitHub Actions -->
  <g filter="url(#cardShadow)">
    <rect x="45" y="179" width="250" height="70" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="75" cy="214" r="16" fill="#818CF8" fill-opacity="0.2"/>
    <text x="75" y="220" text-anchor="middle" fill="#818CF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">⚡</text>
    <text x="105" y="207" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">GitHub Actions</text>
    <text x="105" y="227" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Automated Test, Lint &amp; Security</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M170 249 V276" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="170,281 165,272 175,272" fill="#818CF8"/>

  <!-- Step 3: Docker Build -->
  <g filter="url(#cardShadow)">
    <rect x="45" y="283" width="250" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="75" cy="318" r="16" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="75" y="324" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🐳</text>
    <text x="105" y="311" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Docker Multi-Stage</text>
    <text x="105" y="331" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Optimized Minimal OCI Artifacts</text>
  </g>

  <!-- ==================== CONNECTOR TO PRODUCTION ==================== -->
  <path d="M295 318 H355" stroke="url(#blueGlow)" stroke-width="2.5" stroke-dasharray="5 3"/>
  <polygon points="360,318 352,313 352,323" fill="#38BDF8"/>
  <rect x="303" y="295" width="48" height="20" rx="4" fill="#030712" stroke="#38BDF8" stroke-width="1"/>
  <text x="327" y="309" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">DEPLOY</text>

  <!-- ==================== RIGHT SUBGRAPH: PRODUCTION VPS ==================== -->
  <rect x="365" y="25" width="630" height="370" rx="12" fill="#0B1120" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
  <text x="385" y="55" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">🌐 HARDENED PRODUCTION ENVIRONMENT (LINUX VPS)</text>

  <!-- TOP GATEWAY: NGINX REVERSE PROXY -->
  <g filter="url(#cardShadow)">
    <rect x="385" y="75" width="590" height="66" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="415" cy="108" r="16" fill="#10B981" fill-opacity="0.2"/>
    <text x="415" y="114" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🛡️</text>
    <text x="445" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="bold">Nginx Reverse Proxy &amp; SSL/TLS Gateway</text>
    <text x="445" y="121" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Automated Certbot Renewal · Rate Limiting · DDoS Hardening · SPA Static Cache</text>
  </g>

  <!-- Paths from Nginx -->
  <path d="M525 141 V168 H525 V176" stroke="#10B981" stroke-width="2" fill="none"/>
  <polygon points="525,181 520,172 530,172" fill="#10B981"/>

  <path d="M835 141 V168 H835 V176" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <polygon points="835,181 830,172 840,172" fill="#38BDF8"/>

  <!-- MIDDLE ROW 1: BACKEND APPLICATION SERVER -->
  <g filter="url(#cardShadow)">
    <rect x="385" y="184" width="280" height="72" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="415" cy="220" r="16" fill="#818CF8" fill-opacity="0.2"/>
    <text x="415" y="226" text-anchor="middle" fill="#818CF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">⚡</text>
    <text x="442" y="212" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">FastAPI Python Server</text>
    <text x="442" y="233" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="10.5">Async REST APIs &amp; JWT Auth</text>
  </g>

  <!-- MIDDLE ROW 2: FRONTEND SPA CLIENT -->
  <g filter="url(#cardShadow)">
    <rect x="695" y="184" width="280" height="72" rx="8" fill="#0C2135" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="725" cy="220" r="16" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="725" y="226" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">⚛️</text>
    <text x="752" y="212" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">React + Vite + Tailwind</text>
    <text x="752" y="233" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10.5">Geospatial UI &amp; Real-Time Views</text>
  </g>

  <!-- Connections from FastAPI down to Databases & Engines -->
  <path d="M525 256 V282" stroke="#F43F5E" stroke-width="2"/>
  <polygon points="525,287 520,278 530,278" fill="#F43F5E"/>

  <path d="M605 256 V270 H835 V282" stroke="#C084FC" stroke-width="2" fill="none"/>
  <polygon points="835,287 830,278 840,278" fill="#C084FC"/>

  <!-- BOTTOM ROW 1: POSTGRESQL + POSTGIS -->
  <g filter="url(#cardShadow)">
    <rect x="385" y="290" width="280" height="72" rx="8" fill="#250F1D" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="415" cy="326" r="16" fill="#F43F5E" fill-opacity="0.2"/>
    <text x="415" y="332" text-anchor="middle" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🗄️</text>
    <text x="442" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">PostgreSQL + PostGIS</text>
    <text x="442" y="339" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="10.5">Spatial Queries &amp; Vector Indexes</text>
  </g>

  <!-- BOTTOM ROW 2: INSAR GEOINTELLIGENCE -->
  <g filter="url(#cardShadow)">
    <rect x="695" y="290" width="280" height="72" rx="8" fill="#201335" stroke="#C084FC" stroke-width="1.5"/>
    <circle cx="725" cy="326" r="16" fill="#C084FC" fill-opacity="0.2"/>
    <text x="725" y="332" text-anchor="middle" fill="#C084FC" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🛰️</text>
    <text x="752" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">InSAR Telemetry Engine</text>
    <text x="752" y="339" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10.5">Radar Deformation &amp; Risk Models</text>
  </g>

</svg>
