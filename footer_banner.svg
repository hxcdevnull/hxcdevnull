<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" fill="none">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="80" rx="12" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Wave Accent -->
  <path d="M0,40 C300,10 600,70 1000,30 L1000,80 L0,80 Z" fill="#818CF8" fill-opacity="0.05"/>

  <!-- Center Top Glow Line -->
  <path d="M150 1 H850" stroke="url(#footerLine)" stroke-width="2"/>

  <!-- Footer Tagline -->
  <text x="500" y="48" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">⚡ ARCHITECTING HIGH-VELOCITY PLATFORMS &amp; DATA SYSTEMS ⚡</text>
</svg>
