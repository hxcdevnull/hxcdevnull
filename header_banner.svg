<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="210" rx="16" fill="url(#headerBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Wave Accent 1 -->
  <path d="M0,130 C200,80 350,180 550,120 C750,60 880,160 1000,100 L1000,210 L0,210 Z" fill="#38BDF8" fill-opacity="0.04"/>
  
  <!-- Wave Accent 2 -->
  <path d="M0,150 C250,100 400,200 650,140 C850,80 920,180 1000,130 L1000,210 L0,210 Z" fill="#818CF8" fill-opacity="0.06"/>

  <!-- Decorative Top Glow Line -->
  <path d="M100 1 H900" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Main Name Title -->
  <text x="500" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="0.5">⚡ CHRISTIAN FERRIN</text>

  <!-- Subtitle Role -->
  <text x="500" y="125" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">Chief Technology Officer &amp; DevOps Platform Architect</text>

  <!-- Specialty Badges Row -->
  <text x="500" y="165" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">Cloud Infrastructure · Geospatial Data Engines · Containerization · Engineering Leadership</text>

  <!-- Bottom Accent Divider Line -->
  <path d="M250 188 H750" stroke="url(#accentLine)" stroke-width="1.5"/>
</svg>
